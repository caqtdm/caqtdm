name: caQtDM macOS Package Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'caQtDM_docs/**'
      - 'caQtDM_Tests/**'
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

env:
  QT_MODULES: 'qtserialbus qtpositioning qt5compat qtserialport qtmultimedia qtsensors qtwebsockets qtimageformats qtwebview'

  # Never let Homebrew auto-update or upgrade anything: on the Intel runners
  # (Homebrew Tier 3, no bottles) that means compiling from source for hours.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_UPGRADE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

  DEPS_INSTALL_ROOT: ${{ github.workspace }}/deps
  QWT_INSTALL_DIR: ${{ github.workspace }}/deps/qwt
  ZEROMQ_INSTALL_DIR: ${{ github.workspace }}/deps/zeromq
  EPICS_BASE_DIR: ${{ github.workspace }}/deps/epics-base
  CAQTDM_DIR: ${{ github.workspace }}/caqtdm

jobs:
  build:
    name: Build macOS package
    runs-on: ${{ matrix.macos-version }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        macos-version: ['macos-26','macos-26-intel','macos-15','macos-15-intel' ]
        qt-version: ['6.11.1']
        qwt-version: ['v6.3.0']
        zeromq-version: ['4.3.5']
        epics-version: ['R7.0.10']

    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: caqtdm
          fetch-depth: 0

      - name: Determine EPICS host arch
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            echo "EPICS_HOST_ARCH=darwin-aarch64" >> "$GITHUB_ENV"
          else
            echo "EPICS_HOST_ARCH=darwin-x86" >> "$GITHUB_ENV"
          fi
          echo "Detected machine arch: $ARCH"

      - name: Derive macOS deployment target from matrix
        run: |
          set -euo pipefail
          LABEL="${{ matrix.macos-version }}"
          VER="$(printf '%s' "$LABEL" | sed -E 's/^macos-([0-9]+).*/\1/')"
          if ! printf '%s' "$VER" | grep -qE '^[0-9]+$'; then
            echo "Cannot derive a numeric macOS version from '${LABEL}', falling back to 26" >&2
            VER=26
          fi
          echo "MACOSX_DEPLOYMENT_TARGET=${VER}.0" >> "$GITHUB_ENV"
          echo "Using MACOSX_DEPLOYMENT_TARGET=${VER}.0 (from ${LABEL})"

      - name: Install Qt ${{ matrix.qt-version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          modules: ${{ env.QT_MODULES }}
          host: mac
          target: desktop
          set-env: true
          cache: true

      # Homebrew has moved macOS Intel (x86_64) to Tier 3 (no bottles). Any
      # "brew update"/"brew upgrade" therefore rebuilds outdated formulae from
      # source on the Intel runners (hours, or the 6h job timeout). We only need
      # OpenSSL for Qt OPC UA, which is already preinstalled on the images.
      - name: Install build tools (OpenSSL for Qt OPC UA)
        run: |
          set -euo pipefail
          # Outdated casks (Parallels, browsers, ...) caused problems in earlier runs
          CASKS="$(brew list --cask 2>/dev/null || true)"
          if [ -n "${CASKS}" ]; then
            # shellcheck disable=SC2086
            brew uninstall --cask --force ${CASKS} || true
          fi
          if ! brew --prefix --installed openssl@3 >/dev/null 2>&1; then
            echo "openssl@3 not preinstalled, installing without update/upgrade"
            brew install openssl@3
          fi
          OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          test -f "${OPENSSL_ROOT_DIR}/include/openssl/ssl.h"
          echo "OPENSSL_ROOT_DIR=${OPENSSL_ROOT_DIR}" >> "$GITHUB_ENV"
          "${OPENSSL_ROOT_DIR}/bin/openssl" version

      - name: Create dependencies install directory
        run: mkdir -p "${{ env.DEPS_INSTALL_ROOT }}"

      # -------------------------------------------------------------------
      # Qt OPC UA (built against the installed Qt)
      # -------------------------------------------------------------------
      - name: Clone and build Qt OPC UA
        run: |
          set -euo pipefail
          QTOPCUA_SRC="${{ github.workspace }}/qtopcua-src"
          rm -rf "$QTOPCUA_SRC"
          git clone https://code.qt.io/qt/qtopcua.git "$QTOPCUA_SRC"
          cd "$QTOPCUA_SRC"
          git checkout "v${{ matrix.qt-version }}"
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR"
          cmake --build . --config Release --target install

      # -------------------------------------------------------------------
      # Qwt (built as a macOS framework)
      # -------------------------------------------------------------------
      - name: Cache Qwt
        id: cache-qwt
        uses: actions/cache@v5
        with:
          path: ${{ env.QWT_INSTALL_DIR }}
          key: qwt-${{ matrix.qwt-version }}-qt${{ matrix.qt-version }}-${{ matrix.macos-version }}-${{ runner.arch }}
          restore-keys: |
            qwt-${{ matrix.qwt-version }}-qt${{ matrix.qt-version }}-${{ matrix.macos-version }}-${{ runner.arch }}

      - name: Clone Qwt
        if: steps.cache-qwt.outputs.cache-hit != 'true'
        run: git clone https://git.code.sf.net/p/qwt/git --single-branch --branch ${{ matrix.qwt-version }} qwt
        working-directory: ${{ github.workspace }}

      - name: Configure, Build and Install Qwt
        if: steps.cache-qwt.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/qwt
        run: |
          set -euo pipefail
          # Install into our deps dir and trim parts we do not need in CI
          sed -i '' -E "s|^[[:space:]]*QWT_INSTALL_PREFIX[[:space:]]*=.*|    QWT_INSTALL_PREFIX = ${{ env.QWT_INSTALL_DIR }}|" qwtconfig.pri
          sed -i '' -E 's|^QWT_CONFIG[[:space:]]*\+=[[:space:]]*QwtExamples.*|# QWT_CONFIG += QwtExamples|' qwtconfig.pri
          sed -i '' -E 's|^QWT_CONFIG[[:space:]]*\+=[[:space:]]*QwtPlayground.*|# QWT_CONFIG += QwtPlayground|' qwtconfig.pri
          sed -i '' -E 's|^QWT_CONFIG[[:space:]]*\+=[[:space:]]*QwtTests.*|# QWT_CONFIG += QwtTests|' qwtconfig.pri
          sed -i '' -E 's|^QWT_CONFIG[[:space:]]*\+=[[:space:]]*QwtDesigner.*|# QWT_CONFIG += QwtDesigner|' qwtconfig.pri
          # sed -i '' -E 's|^[[:space:]]*QWT_CONFIG[[:space:]]*\+=[[:space:]]*QwtFramework.*|# QWT_CONFIG += QwtFramework|' qwtconfig.pri
          qmake qwt.pro QMAKE_MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}"
          make -j"$(sysctl -n hw.ncpu)"
          sudo make install

      # -------------------------------------------------------------------
      # ZeroMQ
      # -------------------------------------------------------------------
      - name: Cache ZeroMQ
        id: cache-zeromq
        uses: actions/cache@v5
        with:
          path: ${{ env.ZEROMQ_INSTALL_DIR }}
          key: zeromq-${{ matrix.zeromq-version }}-${{ matrix.macos-version }}-${{ runner.arch }}
          restore-keys: |
            zeromq-${{ matrix.zeromq-version }}-${{ matrix.macos-version }}-${{ runner.arch }}

      - name: Clone, Build and Install ZeroMQ
        if: steps.cache-zeromq.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git clone https://github.com/zeromq/libzmq.git libzmq-src
          cd libzmq-src
          git checkout "v${{ matrix.zeromq-version }}"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="${{ env.ZEROMQ_INSTALL_DIR }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DZMQ_BUILD_PROGRAMS=OFF \
            -DWITH_PERF_TOOL=OFF \
            -DZMQ_BUILD_TESTS=OFF \
            -DBUILD_SHARED=ON \
            -DBUILD_STATIC=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config Release -j"$(sysctl -n hw.ncpu)"
          cmake --install . --config Release

      # -------------------------------------------------------------------
      # EPICS Base
      # -------------------------------------------------------------------
      - name: Cache EPICS Base
        id: cache-epics
        uses: actions/cache@v5
        with:
          path: ${{ env.EPICS_BASE_DIR }}
          key: epics-${{ matrix.epics-version }}-${{ matrix.macos-version }}-${{ runner.arch }}
          restore-keys: |
            epics-${{ matrix.epics-version }}-${{ matrix.macos-version }}-${{ runner.arch }}

      - name: Clone and Build EPICS Base
        if: steps.cache-epics.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${{ env.EPICS_BASE_DIR }}"
          git clone https://github.com/epics-base/epics-base.git --branch "${{ matrix.epics-version }}" --depth 1 "${{ env.EPICS_BASE_DIR }}"
          cd "${{ env.EPICS_BASE_DIR }}"
          git submodule update --init --recursive --jobs "$(sysctl -n hw.ncpu)"
          make -j"$(sysctl -n hw.ncpu)" EPICS_HOST_ARCH="${EPICS_HOST_ARCH}"

      # -------------------------------------------------------------------
      # Python for PYTHONCALC (from the runner toolcache, not from Homebrew)
      # caQtDM.pri only builds Python support on macOS when PYTHONINCLUDE is set.
      # The version is not pinned; the libpython the app links against follows it.
      # -------------------------------------------------------------------
      - name: Set up Python for PYTHONCALC
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'  # latest stable Python 3; PYTHONVERSION is derived below

      - name: Export Python build variables
        run: |
          set -euo pipefail
          PYTHONVERSION="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LDVERSION"))')"
          PYTHONINCLUDE="$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["include"])')"
          PYTHONLIB="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          test -f "${PYTHONINCLUDE}/Python.h"
          test -f "${PYTHONLIB}/libpython${PYTHONVERSION}.dylib"
          # The toolcache Python is a framework build: libpython<ver>.dylib is only a
          # symlink to Python.framework/Versions/<ver>/Python, whose install name
          # (/Library/Frameworks/...) macdeployqt cannot resolve. Create a real,
          # relocatable copy with an @rpath install name and link against that one.
          PYTHON_DEPLOY_LIB="${{ env.DEPS_INSTALL_ROOT }}/python/lib"
          mkdir -p "${PYTHON_DEPLOY_LIB}"
          cp -L "${PYTHONLIB}/libpython${PYTHONVERSION}.dylib" "${PYTHON_DEPLOY_LIB}/libpython${PYTHONVERSION}.dylib"
          chmod u+w "${PYTHON_DEPLOY_LIB}/libpython${PYTHONVERSION}.dylib"
          install_name_tool -id "@rpath/libpython${PYTHONVERSION}.dylib" "${PYTHON_DEPLOY_LIB}/libpython${PYTHONVERSION}.dylib"
          codesign --force --sign - "${PYTHON_DEPLOY_LIB}/libpython${PYTHONVERSION}.dylib"
          file "${PYTHON_DEPLOY_LIB}/libpython${PYTHONVERSION}.dylib"
          otool -D -L "${PYTHON_DEPLOY_LIB}/libpython${PYTHONVERSION}.dylib"
          {
            echo "PYTHONVERSION=${PYTHONVERSION}"
            echo "PYTHONINCLUDE=${PYTHONINCLUDE}"
            echo "PYTHONLIB=${PYTHON_DEPLOY_LIB}"
          } >> "$GITHUB_ENV"
          echo "Using Python ${PYTHONVERSION}: include=${PYTHONINCLUDE} lib=${PYTHON_DEPLOY_LIB} (copied from ${PYTHONLIB})"

      # -------------------------------------------------------------------
      # caQtDM build environment
      # -------------------------------------------------------------------
      - name: Set caQtDM build environment variables
        run: |
          set -euo pipefail
          echo "Using QWTINCLUDE=${{ env.QWT_INSTALL_DIR }}/include"
          {
            echo "QTHOME=${QT_ROOT_DIR}"
            echo "QWTHOME=${{ env.QWT_INSTALL_DIR }}"
            echo "QWTLIB=${{ env.QWT_INSTALL_DIR }}/lib"
            echo "QWTINCLUDE=${{ env.QWT_INSTALL_DIR }}/lib/qwt.framework/Headers"
            echo "QWTVERSION=6.1"
            echo "QWTLIBNAME=qwt"
            echo "EPICS_BASE=${{ env.EPICS_BASE_DIR }}"
            echo "EPICSINCLUDE=${{ env.EPICS_BASE_DIR }}/include"
            echo "EPICSLIB=${{ env.EPICS_BASE_DIR }}/lib/${EPICS_HOST_ARCH}"
            echo "ZMQ=${{ env.ZEROMQ_INSTALL_DIR }}"
            echo "ZMQINC=${{ env.ZEROMQ_INSTALL_DIR }}/include"
            echo "ZMQLIB=${{ env.ZEROMQ_INSTALL_DIR }}/lib"
            echo "ZMQ_VERSION=${{ matrix.zeromq-version }}"
            echo "QTCONTROLS_LIBS=${{ env.CAQTDM_DIR }}/caQtDM_Binaries"
            echo "CAQTDM_COLLECT=${{ env.CAQTDM_DIR }}/caQtDM_Binaries"
            echo "QTBASE=${{ env.CAQTDM_DIR }}/caQtDM_Binaries"
            echo "CAQTDM_CA_ARCHIVELIBS=${{ env.CAQTDM_DIR }}/caQtDM_Binaries"
            echo "CAQTDM_LOGGING_ARCHIVELIBS=${{ env.CAQTDM_DIR }}/caQtDM_Binaries"
          } >> "$GITHUB_ENV"

      - name: Set Qt version mapping
        run: |
          set -euo pipefail
          MAJOR="$(echo '${{ matrix.qt-version }}' | cut -d. -f1)"
          echo "CAQTDMQTVER=QT${MAJOR}" >> "$GITHUB_ENV"

      - name: Create caQtDM binaries directories
        working-directory: ${{ env.CAQTDM_DIR }}
        run: mkdir -p caQtDM_Binaries/designer caQtDM_Binaries/controlsystems

      - name: Normalize Qwt framework install id
        run: |
          set -euo pipefail
          FWDIR="${{ env.QWT_INSTALL_DIR }}/lib"
          BIN="$(find "$FWDIR/qwt.framework/Versions" -type f -name qwt 2>/dev/null | head -n1 || true)"
          if [ -n "$BIN" ]; then
            NEWID="@rpath/${BIN#"$FWDIR/"}"
            sudo install_name_tool -id "$NEWID" "$BIN" 2>/dev/null || true
            sudo codesign --force --sign - "$FWDIR/qwt.framework" 2>/dev/null || true
            echo "Normalized qwt framework id -> $NEWID"
          else
            echo "qwt framework binary not found under $FWDIR" >&2
          fi

      - name: Configure and Build caQtDM
        working-directory: ${{ env.CAQTDM_DIR }}
        run: |
          set -euo pipefail
          export PATH="${QTHOME}/bin:$PATH"
          timerstart=$(date +%s)
          qmake all.pro QMAKE_MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}"
          make -j"$(sysctl -n hw.ncpu)"
          timerstop=$(date +%s)
          echo "caQtDM compile time: $((timerstop - timerstart)) seconds"

      - name: Run unit tests
        shell: bash
        working-directory: ${{ env.CAQTDM_DIR }}/caQtDM_UnitTests
        run: |
          set -euo pipefail

          export PATH="${EPICS_BASE}/bin/${EPICS_HOST_ARCH}:${QTHOME}/bin:${PATH}"
          export DYLD_LIBRARY_PATH="${EPICSLIB}:${ZMQLIB}:${QWTLIB}:${PYTHONLIB}:${CAQTDM_COLLECT}:${CAQTDM_COLLECT}/controlsystems:${DYLD_LIBRARY_PATH:-}"
          export QT_FORCE_STDERR_LOGGING=1
          export QT_LOGGING_TO_CONSOLE=1

          make check

      # -------------------------------------------------------------------
      # Bundle / deploy
      # -------------------------------------------------------------------
      - name: Create macOS application bundle
        working-directory: ${{ env.CAQTDM_DIR }}
        run: |
          set -euo pipefail
          export PATH="${QTHOME}/bin:$PATH"
          APP="caQtDM_Binaries/caQtDM.app"
          if [ ! -d "$APP" ]; then
            echo "Expected application bundle not found at $APP" >&2
            ls -la caQtDM_Binaries || true
            exit 1
          fi
          mkdir -p "$APP/Contents/PlugIns/platforms" \
                   "$APP/Contents/PlugIns/imageformats" \
                   "$APP/Contents/Frameworks"
          # macdeployqt resolves "@rpath/..." dependencies only through the rpath
          # entries of the binaries (Contents/Frameworks), not via -libpath.
          # Put libpython there up front so the reference resolves.
          cp "${PYTHONLIB}/libpython${PYTHONVERSION}.dylib" "$APP/Contents/Frameworks/"
          cp "${QTHOME}"/plugins/imageformats/*.dylib "$APP/Contents/PlugIns/imageformats/" 2>/dev/null || true
          rm -f "$APP"/Contents/PlugIns/imageformats/*_debug.dylib || true
          cp "${QTHOME}/plugins/platforms/libqcocoa.dylib" "$APP/Contents/PlugIns/platforms/" 2>/dev/null || true
          QWT_NEWID=""
          QWT_BIN="$(find "$APP/Contents/Frameworks/qwt.framework/Versions" -type f -name qwt 2>/dev/null | head -n1 || true)"
          if [ -n "$QWT_BIN" ]; then
            QWT_NEWID="@rpath/${QWT_BIN#"$APP/Contents/Frameworks/"}"
            codesign --remove-signature "$APP/Contents/Frameworks/qwt.framework" 2>/dev/null || true
            install_name_tool -id "$QWT_NEWID" "$QWT_BIN" 2>/dev/null || true
            echo "qwt framework id -> $QWT_NEWID"
          fi

          PLUGIN_EXECS=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            file "$f" | grep -q "Mach-O" || continue
            if [ -n "$QWT_NEWID" ]; then
              dep="$(otool -L "$f" 2>/dev/null | awk '/qwt\.framework\/.*qwt$/{print $1; exit}' || true)"
              [ -n "$dep" ] && install_name_tool -change "$dep" "$QWT_NEWID" "$f" 2>/dev/null || true
            fi
            case "$f" in
              */PlugIns/controlsystems/*.dylib)
                install_name_tool -id "@rpath/$(basename "$f")" "$f" 2>/dev/null || true
                PLUGIN_EXECS+=( -executable="$f" )
                ;;
            esac
          done <<< "$(find "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/PlugIns" -type f 2>/dev/null || true)"

          macdeployqt "$APP" \
            -executable="$APP/Contents/MacOS/caQtDM" \
            ${PLUGIN_EXECS[@]+"${PLUGIN_EXECS[@]}"} \
            -libpath="${{ env.CAQTDM_DIR }}/caQtDM_Binaries" \
            -libpath="${EPICSLIB}" \
            -libpath="${QWTLIB}" \
            -libpath="${ZMQLIB}" || true

          # Python must be bundled and referenced relocatably (PYTHONCALC)
          PYLIB="$APP/Contents/Frameworks/libpython${PYTHONVERSION}.dylib"
          test -f "$PYLIB"
          if otool -L "$APP/Contents/Frameworks/libcaQtDM_Lib.dylib" | grep -q "/Library/Frameworks/Python"; then
            echo "libcaQtDM_Lib.dylib still references the system Python framework" >&2
            otool -L "$APP/Contents/Frameworks/libcaQtDM_Lib.dylib"
            exit 1
          fi
          echo "Python deployed: $PYLIB"
          otool -L "$APP/Contents/Frameworks/libcaQtDM_Lib.dylib" | grep -i python || true

          codesign --force --sign - "$APP/Contents/Frameworks/qwt.framework" 2>/dev/null || true
          find "$APP/Contents/PlugIns" -name '*.dylib' -exec codesign --force --sign - {} \; 2>/dev/null || true
          codesign --force --deep --sign - "$APP" 2>/dev/null || true
          codesign --verify --verbose=2 "$APP" 2>&1 || echo "codesign verify reported issues (non-fatal)"

      - name: Create DMG image
        working-directory: ${{ env.CAQTDM_DIR }}
        run: |
          set -euo pipefail
          APP="caQtDM_Binaries/caQtDM.app"
          hdiutil create -volname "caQtDM" -srcfolder "$APP" -ov -format UDZO \
            "${{ github.workspace }}/caQtDM.dmg"

      - name: Upload caQtDM macOS app artifact
        uses: actions/upload-artifact@v7
        with:
          name: caQtDM_macos_${{ matrix.macos-version }}_qt${{ matrix.qt-version }}_qwt${{ matrix.qwt-version }}_zmq${{ matrix.zeromq-version }}_epics${{ matrix.epics-version }}
          path: ${{ env.CAQTDM_DIR }}/caQtDM_Binaries/caQtDM.app

      - name: Upload caQtDM macOS DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: caQtDM_macos_dmg_${{ matrix.macos-version }}_qt${{ matrix.qt-version }}_qwt${{ matrix.qwt-version }}_zmq${{ matrix.zeromq-version }}_epics${{ matrix.epics-version }}
          path: ${{ github.workspace }}/caQtDM.dmg
