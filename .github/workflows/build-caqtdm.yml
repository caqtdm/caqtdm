name: caQtDM Arch Linux Package Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'caQtDM_docs/**'
      - 'caQtDM_Tests/**'
  push:
    paths-ignore:
      - 'caQtDM_docs/**'
      - 'caQtDM_Tests/**'
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

jobs:
  build:
    name: Build Arch package
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
      options: --privileged

    permissions:
      contents: read
      actions: write

    steps:
    - name: Initialize Arch keyring and update system
      run: |
        set -euo pipefail
        pacman-key --init
        pacman-key --populate archlinux
        pacman -Syu --noconfirm

    - name: Install build dependencies
      run: |
        set -euo pipefail
        pacman -S --needed --noconfirm \
          base-devel \
          sudo \
          gcc-libs \
          glibc \
          perl \
          ncurses \
          readline \
          python \
          qt6-base \
          qt6-declarative \
          qt6-positioning \
          qt6-serialbus \
          qt6-tools \
          qwt \
          zeromq \
          git \
          qt6-5compat \
          cmake \
          ninja \
          openssl \
          devtools \
          pacman-contrib \
          nvchecker

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Create non-root builder user
      run: |
        set -euo pipefail
        useradd -m -s /bin/bash builder
        chown -R builder:builder "$GITHUB_WORKSPACE"

    - name: Optimize makepkg.conf for parallel building
      run: |
        set -euo pipefail
        NUM_CORES=$(nproc)
        echo "Detected ${NUM_CORES} CPU cores. Optimizing /etc/makepkg.conf..."
        grep -v "^MAKEFLAGS=" /etc/makepkg.conf > /tmp/makepkg.conf.tmp
        echo "MAKEFLAGS=\"-j${NUM_CORES}\"" >> /tmp/makepkg.conf.tmp
        mv /tmp/makepkg.conf.tmp /etc/makepkg.conf
        echo "Current MAKEFLAGS in /etc/makepkg.conf:"
        grep "MAKEFLAGS" /etc/makepkg.conf

    - name: Match qt6-opcua to Arch Qt and upgrade epics-base
      id: dep_versions
      run: |
        set -euo pipefail
        WORKSPACE_DIR="${GITHUB_WORKSPACE:-$PWD}"
        VERSIONS_FILE="$(mktemp)"
        touch "$VERSIONS_FILE" && chmod 666 "$VERSIONS_FILE"

        sudo -u builder env WORKSPACE_DIR="$WORKSPACE_DIR" VERSIONS_FILE="$VERSIONS_FILE" bash -lc '
          set -euo pipefail
          export TERM=xterm
          ARCH_DIR="$WORKSPACE_DIR/caQtDM_Viewer/package/archlinux"
          cd "$ARCH_DIR/qt6-opcua"
          qt_version=$(pacman -Q qt6-base | awk "{print \$2}")
          qt_version=${qt_version%-*}
          current_version=$(makepkg --printsrcinfo | awk "\$1 == \"pkgver\" {print \$3}")
          if [[ "$current_version" != "$qt_version" ]]; then
            sed -i "s/^pkgver=.*/pkgver=$qt_version/" PKGBUILD
            updpkgsums
          fi
          echo "qt6-opcua=$qt_version" >> "$VERSIONS_FILE"

          cd "$ARCH_DIR/epics-base"
          echo "::group::pkgctl version upgrade epics-base"
          pkgctl version upgrade
          echo "::endgroup::"
          makepkg --printsrcinfo | awk "\$1 == \"pkgver\" {print \"epics-base=\" \$3}" >> "$VERSIONS_FILE"
        '

        cat "$VERSIONS_FILE" | tee -a "$GITHUB_OUTPUT"
        rm -f "$VERSIONS_FILE"

    - name: Cache epics-base package
      id: cache-epics-base
      uses: actions/cache@v5
      with:
        path: caQtDM_Viewer/package/archlinux/epics-base/*.pkg.tar.*
        key: epics-base-pkg-${{ runner.os }}-v${{ steps.dep_versions.outputs.epics-base }}-${{ hashFiles('caQtDM_Viewer/package/archlinux/epics-base/PKGBUILD', 'caQtDM_Viewer/package/archlinux/epics-base/*.patch') }}

    - name: Cache qt6-opcua package
      id: cache-qt6-opcua
      uses: actions/cache@v5
      with:
        path: caQtDM_Viewer/package/archlinux/qt6-opcua/*.pkg.tar.*
        key: qt6-opcua-pkg-${{ runner.os }}-v${{ steps.dep_versions.outputs.qt6-opcua }}-${{ hashFiles('caQtDM_Viewer/package/archlinux/qt6-opcua/PKGBUILD') }}

    - name: Build and install dependency packages
      run: |
        set -euo pipefail
        WORKSPACE_DIR="${GITHUB_WORKSPACE:-$PWD}"

        if ls "$WORKSPACE_DIR"/caQtDM_Viewer/package/archlinux/epics-base/*.pkg.tar.* >/dev/null 2>&1; then
          echo "Using cached epics-base package"
        else
          echo "No cached epics-base package found, building..."
          sudo -u builder env WORKSPACE_DIR="$WORKSPACE_DIR" bash -lc 'cd "$WORKSPACE_DIR/caQtDM_Viewer/package/archlinux/epics-base" && makepkg --noconfirm --cleanbuild'
        fi

        if ls "$WORKSPACE_DIR"/caQtDM_Viewer/package/archlinux/qt6-opcua/*.pkg.tar.* >/dev/null 2>&1; then
          echo "Using cached qt6-opcua package"
        else
          echo "No cached qt6-opcua package found, building..."
          sudo -u builder env WORKSPACE_DIR="$WORKSPACE_DIR" bash -lc 'cd "$WORKSPACE_DIR/caQtDM_Viewer/package/archlinux/qt6-opcua" && makepkg --noconfirm --cleanbuild'
        fi

        pacman -U --noconfirm caQtDM_Viewer/package/archlinux/epics-base/*.pkg.tar.*
        pacman -U --noconfirm caQtDM_Viewer/package/archlinux/qt6-opcua/*.pkg.tar.*

    - name: Build caQtDM package
      run: |
        set -euo pipefail
        WORKSPACE_DIR="${GITHUB_WORKSPACE:-$PWD}"
        sudo -u builder env WORKSPACE_DIR="$WORKSPACE_DIR" CAQTDM_REPO_URL="file://$WORKSPACE_DIR" bash -lc 'cd "$WORKSPACE_DIR/caQtDM_Viewer/package/archlinux/caqtdm" && makepkg --noconfirm --cleanbuild --check'

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        name: caqtdm-archlinux-package
        path: caQtDM_Viewer/package/archlinux/caqtdm/*.pkg.tar.*

    - name: Upload epics-base package artifact
      uses: actions/upload-artifact@v7
      with:
        name: epics-base-archlinux-package
        path: caQtDM_Viewer/package/archlinux/epics-base/*.pkg.tar.*

    - name: Upload qt6-opcua package artifact
      uses: actions/upload-artifact@v7
      with:
        name: qt6-opcua-archlinux-package
        path: caQtDM_Viewer/package/archlinux/qt6-opcua/*.pkg.tar.*
