name: caQtDM RPM Package Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'caQtDM_docs/**'
      - 'caQtDM_Tests/**'
  schedule: # Daily at 2am
    - cron: '0 2 * * *'

jobs:
  build:
    name: Build RPM package
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    env:
      CAQTDM_OPCUA: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:44
            rhel_major: 0
          - image: almalinux:10
            rhel_major: 10
          - image: rockylinux:9
            rhel_major: 9
    permissions:
      contents: read
      actions: write      

    steps:
    - name: Install Node.js
      run: |
        dnf install -y nodejs

    - name: Install git and which
      run: |
        dnf install -y git which

    - name: Prepare EPEL repository
      if: ${{ matrix.rhel_major > 0 }}
      run: |
        set -euo pipefail
        dnf install -y dnf-plugins-core || true
        dnf config-manager --set-enabled crb || true
        # Install EPEL release package matching the major version (e.g., 10, 11)
        dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-${{ matrix.rhel_major }}.noarch.rpm || true
        # Ensure EPEL repo is enabled
        dnf config-manager --set-enabled epel || true

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install build dependencies for epics-base
      run: |
        dnf install -y \
          gcc make patch perl libedit-devel ncurses-devel \
          wget rpmdevtools git

    - name: Build epics-base RPM
      run: |
        cd caQtDM_Viewer/package/redhat/epics-base

        # Create the RPM build environment
        rpmdev-setuptree

        # Download source
        git clone https://github.com/epics-base/epics-base.git --branch R7.0.10 --depth 1 base-7.0.10
        cd base-7.0.10
        git submodule update --init --recursive --jobs "$(nproc)"
        cd ..
        tar -czf base-7.0.10.tar.gz base-7.0.10
        rm -rf base-7.0.10

        # Copy source and patches to rpmbuild directories
        cp base-7.0.10.tar.gz ~/rpmbuild/SOURCES/
        cp ./*.patch ~/rpmbuild/SOURCES/
        cp epics-base.spec ~/rpmbuild/SPECS/

        cd ~/rpmbuild/SPECS
        # Patch epics-base.spec to replace readline-devel dependency with libedit-devel
        sed -i 's/readline-devel/libedit-devel/g' epics-base.spec
        
        # Build the RPM package
        rpmbuild -ba epics-base.spec

    - name: Install epics-base RPM
      run: |
        rpm -ivh ~/rpmbuild/RPMS/*/epics-base-7.0.10-*.rpm

    - name: Install caQtDM build dependencies (RHEL <10, non-Fedora — minimal Qt5 set)
      if: ${{ matrix.rhel_major < 10 && !contains(matrix.image, 'fedora') }}
      run: |
        set -euo pipefail
        dnf install -y \
          qt5-qtbase-devel qt5-qtsvg-devel qt5-qttools-devel qt5-qttools-static \
          qt5-qtwebsockets-devel qt5-qtserialbus-devel qt5-qtlocation-devel \
          qt5-qtx11extras-devel qwt-qt5-devel \
          cmake gcc-c++ make autoconf automake libtool pkgconfig \
          jansson-devel libuuid-devel cppzmq-devel libXext-devel \
          zlib-devel python3-devel tar \
          qt5-assistant qt5-qtimageformats

    - name: Install caQtDM build dependencies (Fedora — minimal Qt6 set)
      if: ${{ contains(matrix.image, 'fedora') }}
      run: |
        set -euo pipefail
        dnf install -y \
          qt6-qtbase-devel qt6-qtsvg-devel qt6-qttools-devel \
          qt6-qt5compat-devel qt6-qtlocation-devel qt6-qtserialbus-devel \
          qt6-qtwebsockets-devel qwt-qt6-devel \
          cmake gcc-c++ make autoconf automake libtool \
          pkgconfig jansson-devel libuuid-devel cppzmq-devel libXext-devel \
          zlib-devel python3-devel tar curl \
          qt6-assistant qt6-qtimageformats
        if [ "${CAQTDM_OPCUA:-0}" = "1" ]; then
          dnf install -y qt6-qtopcua-devel qt6-qtopcua
        else
          echo "Skipping Qt OPC UA dependencies because CAQTDM_OPCUA=${CAQTDM_OPCUA:-0}"
        fi

    - name: Install caQtDM build dependencies (RHEL >=10 — minimal Qt6 set)
      if: ${{ matrix.rhel_major >= 10 }}
      run: |
        set -euo pipefail
        dnf install -y \
          qt6-qtbase-devel qt6-qtsvg-devel qt6-qttools-devel \
          qt6-qt5compat-devel qt6-qtlocation-devel qt6-qtserialbus-devel \
          qt6-qtwebsockets-devel qwt-qt6-devel \
          cmake gcc-c++ make autoconf automake libtool pkgconfig \
          jansson-devel libuuid-devel cppzmq-devel \
          zlib-devel libXext-devel python3-devel \
          tar curl \
          qt6-assistant qt6-qtimageformats
        if [ "${CAQTDM_OPCUA:-0}" = "1" ]; then
          dnf install -y qt6-qtopcua-devel qt6-qtopcua
        else
          echo "Skipping Qt OPC UA dependencies because CAQTDM_OPCUA=${CAQTDM_OPCUA:-0}"
        fi

    - name: Build caQtDM RPM
      run: |
        cd caQtDM_Viewer/package/redhat/caqtdm

        # Set EPICS_BASE environment variable
        export EPICS_BASE_TARGET=/usr/local/epics/base-7.0.10

        # The create-rpm.sh script will handle the rest
        chmod +x create-rpm.sh
        ./create-rpm.sh --no-checkout

    - name: Set artifact name (sanitize image)
      id: set-artifact-names
      run: |
        set -euo pipefail
        image="${{ matrix.image }}"
        # replace ':' with '-' to make a safe artifact name
        sanitized=${image//:/-}
        # single artifact containing all RPMs
        echo "rpms_name=caqtdm-rpms-${sanitized}" >> "$GITHUB_OUTPUT"

    - name: Upload all RPMs as one artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.set-artifact-names.outputs.rpms_name }}
        path: ~/rpmbuild/RPMS/*/*.rpm

    - name: Upload all SRPMs as one artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.set-artifact-names.outputs.rpms_name }}-source-rpms
        path: ~/rpmbuild/SRPMS/*.rpm

    - name: Verify caQtDM installation
      run: |
        rpm -ivh ~/rpmbuild/RPMS/*/caqtdm*.rpm
        which caQtDM || echo "caQtDM not in PATH, checking /opt/caqtdm"
        echo "Listing /opt/caqtdm/lib/qt(ver)/caQtDM:"
        ls -lisah /opt/caqtdm/lib/qt*/caQtDM || true
        caqtdm_bins=(/opt/caqtdm/lib/qt*/caQtDM)
        if [ -e "${caqtdm_bins[0]}" ]; then
          "${caqtdm_bins[0]}" -help || echo "caQtDM execution failed"
        else
          echo "caQtDM execution failed"
        fi
        echo "Listing /opt/caqtdm/lib/qt(ver)/*.so:"
        ls -lisah /opt/caqtdm/lib/qt*/*.so || true
        echo "Listing /opt/caqtdm/lib/qt(ver)/*.a:"
        ls -lisah /opt/caqtdm/lib/qt*/*.a || true
        echo "Listing all plugins:"
        ls -lisah /opt/caqtdm/lib/qt*/*/*.so || true
        echo "caQtDM installation verification completed."
