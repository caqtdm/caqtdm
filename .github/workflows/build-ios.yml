name: caQtDM iOS Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'caQtDM_docs/**'
      - 'caQtDM_Tests/**'
  schedule:
    - cron: '0 2 * * *'

env:
  QT_VERSION: 6.12.0
  OPENSSL_LTS_SERIES: '3.5'
  QWT_VERSION: v6.3.0
  EPICS_VERSION: R7.0.10
  IOS_DEPLOYMENT_TARGET: '18.0'
  QT_ROOT: ${{ github.workspace }}/.ci-cache/Qt
  QT_HOST_ROOT: ${{ github.workspace }}/.ci-cache/Qt/6.12.0/macos
  QT_IOS_DEVICE_ROOT: ${{ github.workspace }}/.ci-cache/Qt/6.12.0/ios-device
  QT_IOS_SIMULATOR_ROOT: ${{ github.workspace }}/.ci-cache/Qt/6.12.0/ios-simulator-arm64
  OPENSSL_IOS_ROOT: ${{ github.workspace }}/.ci-cache/openssl-ios
  EPICS_BASE: ${{ github.workspace }}/.ci-cache/ios-deps/epics-base
  EPICS_HOST_ARCH: darwin-aarch64

jobs:
  build-qt:
    name: Build Qt 6.12.0 host and iOS SDKs
    runs-on: macos-15
    permissions:
      contents: read
      actions: write
    outputs:
      toolchain_key: ${{ steps.toolchain.outputs.key }}
      openssl_version: ${{ steps.openssl-version.outputs.version }}
    steps:
      - name: Identify Xcode and SDKs
        id: toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "key=xcode${XCODE_VERSION}-ios${IOS_SDK}-sim${SIM_SDK}" >> "$GITHUB_OUTPUT"
          echo "Xcode ${XCODE_VERSION}; iOS SDK ${IOS_SDK}; simulator SDK ${SIM_SDK}"

      - name: Determine latest OpenSSL LTS release
        id: openssl-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api --paginate --slurp "repos/openssl/openssl/tags?per_page=100" | \
            jq -er --arg series "${OPENSSL_LTS_SERIES}" \
              '[.[][] | select((.name | sub("^openssl-"; "") | split(".")) as $parts | ($parts[0] + "." + $parts[1] == $series) and ($parts[2] | test("^[0-9]+$")))] | sort_by(.name | sub("^openssl-"; "") | split(".") | map(tonumber)) | last | [.name, .commit.sha] | @tsv')"
          test -n "${latest_tag}"
          IFS=$'\t' read -r OPENSSL_TAG OPENSSL_TAG_SHA <<< "${latest_tag}"
          OPENSSL_VERSION="${OPENSSL_TAG#openssl-}"
          echo "version=${OPENSSL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${OPENSSL_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${OPENSSL_TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "OPENSSL_VERSION=${OPENSSL_VERSION}" >> "$GITHUB_ENV"
          echo "OPENSSL_TAG=${OPENSSL_TAG}" >> "$GITHUB_ENV"
          echo "OPENSSL_TAG_SHA=${OPENSSL_TAG_SHA}" >> "$GITHUB_ENV"
          echo "Using OpenSSL LTS tag ${OPENSSL_TAG} at ${OPENSSL_TAG_SHA}"

      - name: Restore Qt source build cache
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-ios-${{ runner.os }}-${{ runner.arch }}-qt${{ env.QT_VERSION }}-openssl${{ steps.openssl-version.outputs.version }}-${{ steps.toolchain.outputs.key }}-arm64

      - name: Restore OpenSSL iPhoneOS cache
        id: cache-openssl-device
        uses: actions/cache@v5
        with:
          path: ${{ env.OPENSSL_IOS_ROOT }}/${{ steps.openssl-version.outputs.version }}/iphoneos
          key: openssl-ios-${{ steps.openssl-version.outputs.version }}-iphoneos-arm64-${{ steps.toolchain.outputs.key }}

      - name: Restore OpenSSL Simulator cache
        id: cache-openssl-simulator
        uses: actions/cache@v5
        with:
          path: ${{ env.OPENSSL_IOS_ROOT }}/${{ steps.openssl-version.outputs.version }}/iphonesimulator-arm64
          key: openssl-ios-${{ steps.openssl-version.outputs.version }}-iphonesimulator-arm64-${{ steps.toolchain.outputs.key }}

      - name: Install build tools
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install ninja || brew list ninja >/dev/null
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Build OpenSSL for iPhoneOS arm64
        if: steps.cache-openssl-device.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          OPENSSL_PREFIX="${OPENSSL_IOS_ROOT}/${OPENSSL_VERSION}/iphoneos"
          curl -fsSL --retry 3 \
            "https://github.com/openssl/openssl/archive/refs/tags/${OPENSSL_TAG}.tar.gz" \
            -o "${RUNNER_TEMP}/${OPENSSL_TAG}.tar.gz"
          mkdir -p "${RUNNER_TEMP}/openssl-device"
          tar -xzf "${RUNNER_TEMP}/${OPENSSL_TAG}.tar.gz" -C "${RUNNER_TEMP}/openssl-device" --strip-components=1
          cd "${RUNNER_TEMP}/openssl-device"
          ./Configure ios64-xcrun no-shared no-tests \
            --prefix="${OPENSSL_PREFIX}" --openssldir="${OPENSSL_PREFIX}/ssl"
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw

      - name: Build OpenSSL for iOS Simulator arm64
        if: steps.cache-openssl-simulator.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          OPENSSL_PREFIX="${OPENSSL_IOS_ROOT}/${OPENSSL_VERSION}/iphonesimulator-arm64"
          curl -fsSL --retry 3 \
            "https://github.com/openssl/openssl/archive/refs/tags/${OPENSSL_TAG}.tar.gz" \
            -o "${RUNNER_TEMP}/${OPENSSL_TAG}.tar.gz"
          mkdir -p "${RUNNER_TEMP}/openssl-simulator"
          tar -xzf "${RUNNER_TEMP}/${OPENSSL_TAG}.tar.gz" -C "${RUNNER_TEMP}/openssl-simulator" --strip-components=1
          cd "${RUNNER_TEMP}/openssl-simulator"
          ./Configure iossimulator-arm64-xcrun no-shared no-tests \
            --prefix="${OPENSSL_PREFIX}" --openssldir="${OPENSSL_PREFIX}/ssl"
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw

      - name: Verify OpenSSL archives
        run: |
          set -euo pipefail
          for target in iphoneos iphonesimulator-arm64; do
            prefix="${OPENSSL_IOS_ROOT}/${OPENSSL_VERSION}/${target}"
            test -f "${prefix}/include/openssl/ssl.h"
            test -f "${prefix}/lib/libssl.a"
            test -f "${prefix}/lib/libcrypto.a"
            lipo -archs "${prefix}/lib/libssl.a" | grep -qw arm64
            lipo -archs "${prefix}/lib/libcrypto.a" | grep -qw arm64
          done

      - name: Build Qt host tools and iOS frameworks
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          run_with_heartbeat() {
            local label="$1"
            shift
            "$@" &
            local command_pid=$!
            (
              while kill -0 "${command_pid}" 2>/dev/null; do
                sleep 60
                if kill -0 "${command_pid}" 2>/dev/null; then
                  echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') Still running: ${label} (pid ${command_pid})"
                fi
              done
            ) &
            local heartbeat_pid=$!
            local result=0
            wait "${command_pid}" || result=$?
            kill "${heartbeat_pid}" 2>/dev/null || true
            wait "${heartbeat_pid}" 2>/dev/null || true
            return "${result}"
          }

          mkdir -p "${QT_ROOT}" "${RUNNER_TEMP}/qt-src"
          QT_TARBALL="qt-everywhere-src-${QT_VERSION}.tar.xz"
          QT_MINOR="$(echo "${QT_VERSION}" | cut -d. -f1,2)"
          QT_URL="https://download.qt.io/official_releases/qt/${QT_MINOR}/${QT_VERSION}/single/${QT_TARBALL}"
          QT_ARCHIVE="${RUNNER_TEMP}/${QT_TARBALL}"
          echo "::group::Download Qt ${QT_VERSION} source"
          echo "Source URL: ${QT_URL}"
          echo "Saving to: ${QT_ARCHIVE}"
          curl --fail --location --show-error --retry 3 --progress-bar \
            --write-out $'\nHTTP %{http_code}; downloaded %{size_download} bytes in %{time_total}s\n' \
            "${QT_URL}" -o "${QT_ARCHIVE}"
          test -s "${QT_ARCHIVE}"
          echo "Archive size: $(stat -f%z "${QT_ARCHIVE}") bytes"
          shasum -a 256 "${QT_ARCHIVE}"
          echo "::endgroup::"

          echo "::group::Extract Qt ${QT_VERSION} source"
          echo "Extracting ${QT_ARCHIVE} into ${RUNNER_TEMP}/qt-src"
          tar -xf "${RUNNER_TEMP}/${QT_TARBALL}" -C "${RUNNER_TEMP}/qt-src"
          QT_SRC="${RUNNER_TEMP}/qt-src/qt-everywhere-src-${QT_VERSION}"
          test -d "${QT_SRC}"
          echo "Qt source directory ready: ${QT_SRC}"
          echo "::endgroup::"
          QT_HOST_SUBMODULES='qtbase,qt5compat,qtsvg,qttools,qtimageformats,qtpositioning,qtopcua'
          QT_IOS_SUBMODULES='qtbase,qt5compat,qtsvg,qttools,qtimageformats,qtpositioning,qtopcua'

          mkdir -p "${RUNNER_TEMP}/qt-build-host"
          cd "${RUNNER_TEMP}/qt-build-host"
          echo "::group::Configure Qt ${QT_VERSION} host tools"
          echo "Install prefix: ${QT_HOST_ROOT}"
          echo "Qt modules: ${QT_HOST_SUBMODULES}"
          "${QT_SRC}/configure" \
            -prefix "${QT_HOST_ROOT}" \
            -submodules "${QT_HOST_SUBMODULES}" \
            -release -opensource -confirm-license \
            -nomake tests -nomake examples
          echo "::endgroup::"
          echo "::group::Build and install Qt host tools"
          run_with_heartbeat "Build Qt host tools" cmake --build . --parallel
          run_with_heartbeat "Install Qt host tools" cmake --install .
          echo "Verifying host OPC UA code generator and CMake package"
          test -x "${QT_HOST_ROOT}/bin/qopcuaxmldatatypes2cpp"
          test -f "${QT_HOST_ROOT}/lib/cmake/Qt6OpcUaTools/Qt6OpcUaToolsConfig.cmake"
          echo "Host Qt installation ready at ${QT_HOST_ROOT}"
          echo "::endgroup::"

          for target in iphoneos iphonesimulator; do
            if [ "${target}" = iphoneos ]; then
              qt_prefix="${QT_IOS_DEVICE_ROOT}"
              openssl_prefix="${OPENSSL_IOS_ROOT}/${OPENSSL_VERSION}/iphoneos"
            else
              qt_prefix="${QT_IOS_SIMULATOR_ROOT}"
              openssl_prefix="${OPENSSL_IOS_ROOT}/${OPENSSL_VERSION}/iphonesimulator-arm64"
            fi
            build_dir="${RUNNER_TEMP}/qt-build-${target}"
            mkdir -p "${build_dir}"
            cd "${build_dir}"
            echo "::group::Configure Qt ${QT_VERSION} for ${target}"
            echo "SDK version: $(xcrun --sdk "${target}" --show-sdk-version)"
            echo "Install prefix: ${qt_prefix}"
            echo "OpenSSL prefix: ${openssl_prefix}"
            echo "Qt modules: ${QT_IOS_SUBMODULES}"
            "${QT_SRC}/configure" \
              -prefix "${qt_prefix}" \
              -platform macx-ios-clang -sdk "${target}" \
              -qt-host-path "${QT_HOST_ROOT}" \
              -submodules "${QT_IOS_SUBMODULES}" \
              -openssl-linked -feature-open62541-security \
              -release -opensource -confirm-license \
              -nomake tests -nomake examples \
              -- \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DOPENSSL_ROOT_DIR="${openssl_prefix}" \
              -DOPENSSL_USE_STATIC_LIBS=ON \
              -DFEATURE_open62541_security=ON
            summary_file="${build_dir}/config.summary"
            echo "Checking Qt's configure summary for Open62541 security support"
            if [ ! -f "${summary_file}" ]; then
              echo "Qt configure did not create ${summary_file}"
              exit 1
            fi
            if ! grep -Eq 'Open62541 security support[.[:space:]]+yes' "${summary_file}"; then
              cat "${summary_file}"
              echo "Open62541 security support was not enabled for ${target}; stopping before the Qt build"
              exit 1
            fi
            grep -E 'Open62541 security support' "${summary_file}"
            echo "::endgroup::"
            echo "::group::Build and install Qt ${QT_VERSION} for ${target}"
            run_with_heartbeat "Build Qt for ${target}" cmake --build . --parallel
            run_with_heartbeat "Install Qt for ${target}" cmake --install .
            echo "Verifying QtPositioning, QtOpcUa, and secure Open62541 backend for ${target}"
            test -d "${qt_prefix}/lib/QtPositioning.framework"
            test -d "${qt_prefix}/lib/QtOpcUa.framework"
            opcua_backend="${qt_prefix}/plugins/opcua/libopen62541_backend.a"
            test -f "${opcua_backend}"
            echo "Qt ${target} installation ready at ${qt_prefix}"
            echo "::endgroup::"
          done

          test -x "${QT_HOST_ROOT}/bin/qmake"
          for qt_prefix in "${QT_IOS_DEVICE_ROOT}" "${QT_IOS_SIMULATOR_ROOT}"; do
            test -x "${qt_prefix}/bin/qmake"
            test -d "${qt_prefix}/lib/QtCore.framework"
            test -d "${qt_prefix}/lib/QtCore5Compat.framework"
            test -d "${qt_prefix}/lib/QtUiTools.framework"
            test -d "${qt_prefix}/lib/QtSvg.framework"
            test -d "${qt_prefix}/lib/QtPositioning.framework"
            test -d "${qt_prefix}/lib/QtOpcUa.framework"
            test -f "${qt_prefix}/plugins/opcua/libopen62541_backend.a"
          done

  build-epics:
    name: Build EPICS 7.0.10 for iOS SDKs
    runs-on: macos-15
    needs: build-qt
    permissions:
      contents: read
      actions: write
    outputs:
      toolchain_key: ${{ steps.toolchain.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Identify Xcode and SDKs
        id: toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "key=xcode${XCODE_VERSION}-ios${IOS_SDK}-sim${SIM_SDK}" >> "$GITHUB_OUTPUT"

      - name: Restore Qt source build cache
        uses: actions/cache@v5
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-ios-${{ runner.os }}-${{ runner.arch }}-qt${{ env.QT_VERSION }}-openssl${{ needs.build-qt.outputs.openssl_version }}-${{ needs.build-qt.outputs.toolchain_key }}-arm64

      - name: Verify Qt toolchain
        run: |
          set -euo pipefail
          test -x "${QT_HOST_ROOT}/bin/qmake"
          for qt_prefix in "${QT_IOS_DEVICE_ROOT}" "${QT_IOS_SIMULATOR_ROOT}"; do
            test -x "${qt_prefix}/bin/qmake"
            test -d "${qt_prefix}/lib/QtCore.framework"
            test -d "${qt_prefix}/lib/QtPositioning.framework"
            test -d "${qt_prefix}/lib/QtOpcUa.framework"
            test -f "${qt_prefix}/plugins/opcua/libopen62541_backend.a"
          done
          ACTUAL_TOOLCHAIN="xcode$(xcodebuild -version | awk '/^Xcode / {print $2}')-ios$(xcrun --sdk iphoneos --show-sdk-version)-sim$(xcrun --sdk iphonesimulator --show-sdk-version)"
          test "${ACTUAL_TOOLCHAIN}" = "${{ needs.build-qt.outputs.toolchain_key }}"

      - name: Cache EPICS 7.0.10 iOS build
        id: cache-epics
        uses: actions/cache@v5
        with:
          path: ${{ env.EPICS_BASE }}
          key: epics-ios-${{ runner.os }}-${{ runner.arch }}-epics${{ env.EPICS_VERSION }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('ci/epics-ios/**') }}

      - name: Build EPICS host tools and iOS libraries
        if: steps.cache-epics.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --branch "${EPICS_VERSION}" \
            https://github.com/epics-base/epics-base.git "${RUNNER_TEMP}/epics-src"
          cd "${RUNNER_TEMP}/epics-src"
          cp "${GITHUB_WORKSPACE}/ci/epics-ios/configure/CONFIG_SITE.local" configure/CONFIG_SITE.local
          cp "${GITHUB_WORKSPACE}/ci/epics-ios/configure/os/CONFIG.Common.iosCommon" configure/os/CONFIG.Common.iosCommon
          cp "${GITHUB_WORKSPACE}/ci/epics-ios/configure/os/CONFIG_SITE.Common.iosCommon" configure/os/CONFIG_SITE.Common.iosCommon
          cp "${GITHUB_WORKSPACE}/ci/epics-ios/configure/os/CONFIG_SITE.Common.ios-arm" configure/os/CONFIG_SITE.Common.ios-arm
          cp "${GITHUB_WORKSPACE}/ci/epics-ios/configure/os/CONFIG.Common.ios-sim-arm64" configure/os/CONFIG.Common.ios-sim-arm64
          cp "${GITHUB_WORKSPACE}/ci/epics-ios/configure/os/CONFIG_SITE.Common.ios-sim-arm64" configure/os/CONFIG_SITE.Common.ios-sim-arm64

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("modules/pva2pva")
          matches = []
          for makefile in root.rglob("Makefile"):
              lines = makefile.read_text().splitlines(keepends=True)
              for index, line in enumerate(lines):
                  definition = line.split("#", 1)[0].strip()
                  if "softIocPVA" in definition and re.match(r"^(?:TEST)?PROD(?:_IOC)?\s*\+?=", definition):
                      matches.append((makefile, lines, index, line))

          if len(matches) != 1:
              raise SystemExit(f"Expected one softIocPVA product declaration, found {len(matches)}")

          makefile, lines, index, line = matches[0]
          lines[index] = "# Omitted for iOS: softIocPVA is an executable, not a library.\n"
          makefile.write_text("".join(lines))
          print(f"Disabled iOS softIocPVA product in {makefile}")
          PY

          make -j"$(sysctl -n hw.ncpu)" EPICS_HOST_ARCH="${EPICS_HOST_ARCH}"
          mkdir -p "${EPICS_BASE}/include" "${EPICS_BASE}/lib/ios-arm" "${EPICS_BASE}/lib/ios-sim-arm64"
          rsync -a include/ "${EPICS_BASE}/include/"
          rsync -a lib/ios-arm/ "${EPICS_BASE}/lib/ios-arm/"
          rsync -a lib/ios-sim-arm64/ "${EPICS_BASE}/lib/ios-sim-arm64/"

      - name: Verify EPICS target archives
        run: |
          set -euo pipefail
          for arch in ios-arm ios-sim-arm64; do
            for lib in ca Com dbCore dbRecStd nt pvAccess pvAccessCA pvAccessIOC pvaClient pvData pvDatabase qsrv; do
              test -f "${EPICS_BASE}/lib/${arch}/lib${lib}.a"
              lipo -archs "${EPICS_BASE}/lib/${arch}/lib${lib}.a" | grep -qw arm64
            done
          done

  build-ios:
    name: Build ${{ matrix.name }}
    runs-on: macos-15
    needs: [build-qt, build-epics]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhoneOS arm64
            sdk: iphoneos
            epics_arch: ios-arm
            configuration: iphoneos
          - name: iOS Simulator arm64
            sdk: iphonesimulator
            epics_arch: ios-sim-arm64
            configuration: iphonesimulator
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Qt source build cache
        uses: actions/cache@v5
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-ios-${{ runner.os }}-${{ runner.arch }}-qt${{ env.QT_VERSION }}-openssl${{ needs.build-qt.outputs.openssl_version }}-${{ needs.build-qt.outputs.toolchain_key }}-arm64

      - name: Restore EPICS iOS cache
        uses: actions/cache@v5
        with:
          path: ${{ env.EPICS_BASE }}
          key: epics-ios-${{ runner.os }}-${{ runner.arch }}-epics${{ env.EPICS_VERSION }}-${{ needs.build-epics.outputs.toolchain_key }}-${{ hashFiles('ci/epics-ios/**') }}

      - name: Verify cached dependencies
        run: |
          set -euo pipefail
          test -x "${QT_HOST_ROOT}/bin/qmake"
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then
            QT_TARGET_ROOT="${QT_IOS_DEVICE_ROOT}"
          else
            QT_TARGET_ROOT="${QT_IOS_SIMULATOR_ROOT}"
          fi
          test -x "${QT_TARGET_ROOT}/bin/qmake"
          test -d "${QT_TARGET_ROOT}/lib/QtCore.framework"
          test -d "${QT_TARGET_ROOT}/lib/QtPositioning.framework"
          test -d "${QT_TARGET_ROOT}/lib/QtOpcUa.framework"
          test -f "${QT_TARGET_ROOT}/plugins/opcua/libopen62541_backend.a"
          test -f "${QT_TARGET_ROOT}/mkspecs/modules/qt_plugin_open62541_backend.pri"
          ACTUAL_TOOLCHAIN="xcode$(xcodebuild -version | awk '/^Xcode / {print $2}')-ios$(xcrun --sdk iphoneos --show-sdk-version)-sim$(xcrun --sdk iphonesimulator --show-sdk-version)"
          test "${ACTUAL_TOOLCHAIN}" = "${{ needs.build-qt.outputs.toolchain_key }}"
          test "${ACTUAL_TOOLCHAIN}" = "${{ needs.build-epics.outputs.toolchain_key }}"
          for lib in ca Com dbCore dbRecStd nt pvAccess pvAccessCA pvAccessIOC pvaClient pvData pvDatabase qsrv; do
            test -f "${EPICS_BASE}/lib/${{ matrix.epics_arch }}/lib${lib}.a"
          done

      - name: Cache Qwt
        id: cache-qwt
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ci-cache/qwt-${{ matrix.epics_arch }}
          key: qwt-ios-${{ runner.os }}-${{ runner.arch }}-${{ env.QWT_VERSION }}-qt${{ env.QT_VERSION }}-${{ matrix.epics_arch }}-${{ needs.build-qt.outputs.toolchain_key }}

      - name: Build Qwt
        if: steps.cache-qwt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then
            QT_TARGET_ROOT="${QT_IOS_DEVICE_ROOT}"
          else
            QT_TARGET_ROOT="${QT_IOS_SIMULATOR_ROOT}"
          fi
          git clone --depth 1 --single-branch --branch "${QWT_VERSION}" \
            https://git.code.sf.net/p/qwt/git "${RUNNER_TEMP}/qwt-src"
          sed -i '' -E "s|^[[:space:]]*QWT_INSTALL_PREFIX[[:space:]]*=.*|QWT_INSTALL_PREFIX = ${GITHUB_WORKSPACE}/.ci-cache/qwt-${{ matrix.epics_arch }}|" \
            "${RUNNER_TEMP}/qwt-src/qwtconfig.pri"
          sed -i '' -E 's@^QWT_CONFIG[[:space:]]*\+=[[:space:]]*Qwt(Dll|Designer|Examples|Playground|Tests|Framework|PkgConfig).*@# disabled for mobile: &@' \
            "${RUNNER_TEMP}/qwt-src/qwtconfig.pri"
          grep -q '^QWT_CONFIG[[:space:]]*+=[[:space:]]*QwtStatic' "${RUNNER_TEMP}/qwt-src/qwtconfig.pri" || \
            echo 'QWT_CONFIG += QwtStatic' >> "${RUNNER_TEMP}/qwt-src/qwtconfig.pri"
          mkdir -p "${RUNNER_TEMP}/qwt-build"
          cd "${RUNNER_TEMP}/qwt-build"
          SDKROOT="$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
            "${QT_TARGET_ROOT}/bin/qmake" "${RUNNER_TEMP}/qwt-src/qwt.pro" \
            "CONFIG+=${{ matrix.configuration }}" \
            QMAKE_APPLE_DEVICE_ARCHS=arm64 QMAKE_APPLE_SIMULATOR_ARCHS=arm64
          SDKROOT="$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
            CODE_SIGNING_ALLOWED=NO make -j"$(sysctl -n hw.ncpu)"
          make install
          test -f "${GITHUB_WORKSPACE}/.ci-cache/qwt-${{ matrix.epics_arch }}/lib/libqwt.a"

      - name: Export caQtDM build environment
        run: |
          set -euo pipefail
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then
            QT_TARGET_ROOT="${QT_IOS_DEVICE_ROOT}"
          else
            QT_TARGET_ROOT="${QT_IOS_SIMULATOR_ROOT}"
          fi
          QWT_ROOT="${GITHUB_WORKSPACE}/.ci-cache/qwt-${{ matrix.epics_arch }}"
          {
            echo "QTHOME=${QT_TARGET_ROOT}"
            echo "QWTHOME=${QWT_ROOT}"
            echo "QWTINCLUDE=${QWT_ROOT}/include"
            echo "QWTLIB=${QWT_ROOT}/lib"
            echo "QWTLIBNAME=qwt"
            echo "QWTVERSION=6.1"
            echo "EPICS_BASE=${EPICS_BASE}"
            echo "EPICS_HOST_ARCH=${{ matrix.epics_arch }}"
            echo "EPICSINCLUDE=${EPICS_BASE}/include"
            echo "EPICSLIB=${EPICS_BASE}/lib/${{ matrix.epics_arch }}"
            echo "EPICSEXTENSIONS=/usr/lib/epics/extensions"
            echo "CAQTDM_COLLECT=${RUNNER_TEMP}/caqtdm-build/caQtDM_Binaries"
            echo "QTCONTROLS_LIBS=${RUNNER_TEMP}/caqtdm-build/caQtDM_Binaries"
            echo "QTBASE=${RUNNER_TEMP}/caqtdm-build/caQtDM_Binaries"
            echo "CAQTDM_GPS=1"
            echo "CAQTDM_OPCUA=1"
          } >> "$GITHUB_ENV"

      - name: Prepare temporary source tree
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/caqtdm-build"
          rsync -a --exclude='.git' --exclude='.ci-cache' \
            "${GITHUB_WORKSPACE}/" "${RUNNER_TEMP}/caqtdm-build/"
          mkdir -p "${CAQTDM_COLLECT}/designer" "${CAQTDM_COLLECT}/controlsystems"

      - name: Build caQtDM for ${{ matrix.name }}
        working-directory: ${{ runner.temp }}/caqtdm-build
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
            "${QTHOME}/bin/qmake" all.pro \
            "CONFIG+=${{ matrix.configuration }}" \
            QMAKE_IOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            QMAKE_IOS_DEVICE_ARCHS=arm64 \
            QMAKE_APPLE_SIMULATOR_ARCHS=arm64
          (
            cd caQtDM_Viewer
            SDKROOT="$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
              "${QTHOME}/bin/qmake" caQtDM_Viewer.pro \
              "CONFIG+=${{ matrix.configuration }}" \
              QMAKE_IOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
              QMAKE_IOS_DEVICE_ARCHS=arm64 \
              QMAKE_APPLE_SIMULATOR_ARCHS=arm64
          )
          if [ "${{ matrix.sdk }}" = iphoneos ]; then
            XCODE_DESTINATION='generic/platform=iOS'
          else
            XCODE_DESTINATION='generic/platform=iOS Simulator'
          fi
          (
            cd caQtDM_Viewer
            XCODE_SETTINGS="$(xcodebuild -project caQtDM.xcodeproj \
              -scheme caQtDM \
              -configuration Release \
              -sdk '${{ matrix.sdk }}' \
              -destination "${XCODE_DESTINATION}" \
              -showBuildSettings \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=)"
            grep -F 'CODE_SIGNING_ALLOWED = NO' <<< "${XCODE_SETTINGS}" || {
              echo "xcodebuild did not accept CODE_SIGNING_ALLOWED=NO" >&2
              exit 1
            }
            grep -F 'CODE_SIGNING_REQUIRED = NO' <<< "${XCODE_SETTINGS}" || {
              echo "xcodebuild did not accept CODE_SIGNING_REQUIRED=NO" >&2
              exit 1
            }
          )
          mapfile -t viewer_targets < <(
            awk '/^sub-caQtDM_Viewer-make_first:/ {
              for (i = 2; i <= NF; ++i)
                if ($i != "FORCE") print $i
            }' Makefile
          )
          if [ "${#viewer_targets[@]}" -eq 0 ]; then
            echo 'No caQtDM Viewer prerequisites found in the generated Makefile' >&2
            exit 1
          fi
          printf 'Building caQtDM Viewer prerequisites: %s\n' "${viewer_targets[*]}"
          SDKROOT="$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
            make -j"$(sysctl -n hw.ncpu)" "${viewer_targets[@]}"
          (
            cd caQtDM_Viewer
            SDKROOT="$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
              xcodebuild build \
              -project caQtDM.xcodeproj \
              -scheme caQtDM \
              -configuration Release \
              -sdk '${{ matrix.sdk }}' \
              -destination "${XCODE_DESTINATION}" \
              -destination-timeout 1 \
              ENABLE_ONLY_ACTIVE_RESOURCES=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=
          )

      - name: Verify and archive app
        working-directory: ${{ runner.temp }}/caqtdm-build
        run: |
          set -euo pipefail
          APP="$(find caQtDM_Viewer -type d -name 'caQtDM.app' -print -quit)"
          test -n "${APP}"
          EXECUTABLE="${APP}/caQtDM"
          test -x "${EXECUTABLE}"
          lipo -archs "${EXECUTABLE}" | grep -qw arm64
          BUILD_INFO="$(xcrun vtool -show-build "${EXECUTABLE}")"
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then
            grep -q 'platform IOS$' <<< "${BUILD_INFO}"
          else
            grep -q 'platform IOSSIMULATOR$' <<< "${BUILD_INFO}"
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Info.plist" | grep -qx 'ch.psi.caQtDM'
          test -f "${APP}/caQtDM_IOS_Config.xml"
          test -f "${APP}/fonts/lucida-sans-typewriter.ttf"
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "${APP}/Info.plist" | grep -q .
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then
            QT_TARGET_ROOT="${QT_IOS_DEVICE_ROOT}"
          else
            QT_TARGET_ROOT="${QT_IOS_SIMULATOR_ROOT}"
          fi
          test -f "${QT_TARGET_ROOT}/plugins/opcua/libopen62541_backend.a"
          strings "${EXECUTABLE}" | grep -F 'SecurityPolicy#Basic256Sha256' >/dev/null
          if codesign -dv "${APP}" >/dev/null 2>&1; then
            echo "Expected an unsigned CI app bundle"
            exit 1
          fi
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          ditto -c -k --sequesterRsrc --keepParent "${APP}" \
            "${GITHUB_WORKSPACE}/artifacts/caQtDM-${{ matrix.epics_arch }}.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: caQtDM-ios-${{ matrix.epics_arch }}-${{ github.sha }}
          path: artifacts/*.zip
